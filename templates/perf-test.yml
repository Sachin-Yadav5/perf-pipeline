# This file is installed in every repository. It does not need any edits.
# All logic lives in the central repository (__ORG__/perf-pipeline); updates there apply here automatically.
name: PR Performance Test

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf:
    # Runs only when the PR description contains a ```perf block.
    if: contains(github.event.pull_request.body, '```perf')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: __ORG__/perf-pipeline@v1
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
